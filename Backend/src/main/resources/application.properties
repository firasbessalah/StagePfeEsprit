spring.application.name=pfePorject

# ── DataSource ────────────────────────────────────────────────────────────────
# Docker / production: values come from environment variables
# Local: set these variables in your environment or .env file
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rental_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Jackson — allow null for primitive fields
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# ── AI Microservice ───────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://${AI_SERVICE_HOSTPORT:localhost:8000}}

# ── Mail (Brevo SMTP via port 2525) ───────────────────────────────────────────
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:firasbessalahboos@gmail.com}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Google Sign-In ────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:157705461336-rfp316ppj82jf6d6aonila5bbfm0sivj.apps.googleusercontent.com}

# ── Actuator & Prometheus monitoring ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Tag every metric with the application name
management.metrics.tags.application=${spring.application.name}

# Disable mail health check
management.health.mail.enabled=false