spring.application.name=pfePorject

# ── DataSource ────────────────────────────────────────────────────────────────
# In Docker: values come from SPRING_DATASOURCE_* env vars set in docker-compose.yml
# Locally:   keep a .env or set env vars, OR override below for dev convenience
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rental_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:firas}

spring.jpa.hibernate.ddl-auto=validate

# Jackson — allow null for primitive fields (e.g. boolean enabled)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:3f8a2b1c9d4e7f6a0b5c8d2e1f4a7b9c3d6e8f0a2b5c7d9e1f3a6b8c0d2e4f6}
jwt.expiration=86400000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# ── AI Microservice ───────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ── Mail (Brevo SMTP via port 2525) ─────────────────────────────────────────────
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM:firasbessalahboos@hotmail.fr}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Google Sign-In ────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:157705461336-rfp316ppj82jf6d6aonila5bbfm0sivj.apps.googleusercontent.com}
