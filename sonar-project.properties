# =============================================================================
# SonarQube Project Configuration
# =============================================================================
# Run analysis with:  sonar-scanner (after generating a token in SonarQube UI)
# =============================================================================

sonar.projectKey=pfe-realestate
sonar.projectName=PFE Real Estate Platform
sonar.projectVersion=1.0

# Host URL (local Docker instance)
sonar.host.url=http://localhost:9000

# =============================================================================
# Source directories
# =============================================================================
sonar.sources=Backend/src/main/java,ai-sentiment,frontend

# =============================================================================
# Test directories
# =============================================================================
sonar.tests=Backend/src/test/java,ai-sentiment/tests

# Include .spec.ts files as tests from the frontend
sonar.test.inclusions=\
  frontend/src/**/*.spec.ts,\
  Backend/src/test/java/**,\
  ai-sentiment/tests/**

# =============================================================================
# Exclusions
# =============================================================================
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/scripts/**,\
  **/*.pyc,\
  **/assets/**,\
  **/environments/**,\
  frontend/src/scss/fonts/**,\
  frontend/src/scss/plugins/**,\
  frontend/src/app/demo/pages/**,\
  frontend/src/app/demo/ui-elements/**,\
  frontend/src/scss/theme-elements/**,\
  frontend/src/scss/_custom.scss

# Source encoding
sonar.sourceEncoding=UTF-8

# =============================================================================
# Language-specific settings
# =============================================================================
# Java (Backend)
sonar.java.binaries=Backend/target/classes
sonar.java.source=17
sonar.coverage.jacoco.xmlReportPaths=Backend/target/site/jacoco/jacoco.xml

# TypeScript / JavaScript (Frontend)
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Python (AI service)
sonar.python.version=3.11
