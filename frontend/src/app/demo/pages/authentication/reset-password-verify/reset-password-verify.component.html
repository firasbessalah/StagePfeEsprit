<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-shield auth-icon"></i>
        </div>
        <h3 class="mb-2">Code de vérification</h3>
        <p class="text-muted mb-4">
          Un code a été envoyé à <strong>{{ email }}</strong>. Saisissez-le ci-dessous pour choisir un nouveau mot de
          passe.
        </p>

        <div class="text-start mb-3">
          <label class="form-label" for="reset-email">Email</label>
          <input
            id="reset-email"
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            [disabled]="verifyLoading()"
          />
        </div>
        <div class="text-start mb-4">
          <label class="form-label" for="reset-code">Code à 6 chiffres</label>
          <input
            id="reset-code"
            type="text"
            class="form-control text-center fs-4 letter-spacing-code"
            name="code"
            [(ngModel)]="code"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]*"
            autocomplete="one-time-code"
            [disabled]="verifyLoading()"
            placeholder="000000"
          />
        </div>

        @if (message() && !verifyLoading()) {
          <div class="alert alert-danger text-start mb-3" role="alert">
            {{ message() }}
          </div>
        }

        <button type="button" class="btn btn-primary shadow-2 mb-3 w-100" [disabled]="verifyLoading()" (click)="submit()">
          @if (verifyLoading()) {
            <span>Vérification…</span>
          } @else {
            <span>Continuer</span>
          }
        </button>

        <p class="mb-0 text-muted">
          <a [routerLink]="['/forgot-password']">Demander un autre code</a>
          &nbsp;·&nbsp;
          <a [routerLink]="['/login']">Connexion</a>
        </p>
      </div>
    </div>
  </div>
</div>
