<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-lock auth-icon"></i>
        </div>
        <h3 class="mb-2">Nouveau mot de passe</h3>
        <p class="text-muted mb-4">Choisissez un mot de passe d’au moins 8 caractères.</p>

        <div class="text-start mb-3">
          <label class="form-label" for="np">Nouveau mot de passe</label>
          @if (!showPassword()) {
            <input
              id="np"
              type="password"
              class="form-control"
              name="newPassword"
              [(ngModel)]="newPassword"
              autocomplete="new-password"
              [disabled]="submitLoading()"
              placeholder="Au moins 8 caractères"
            / aria-label=\"input\">
          } @else {
            <input
              id="np"
              type="text"
              class="form-control"
              name="newPassword"
              [(ngModel)]="newPassword"
              autocomplete="new-password"
              [disabled]="submitLoading()"
              placeholder="Au moins 8 caractères"
            / aria-label=\"input\">
          }
          <button type="button" class="btn btn-link btn-sm px-0 mt-1" (click)="togglePassword()" tabindex="0" (keydown.enter)="null">
            {{ showPassword() ? 'Masquer' : 'Afficher' }} le mot de passe
          </button>
        </div>

        <div class="text-start mb-4">
          <label class="form-label" for="npc">Confirmer le mot de passe</label>
          @if (!showPassword()) {
            <input
              id="npc"
              type="password"
              class="form-control"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              autocomplete="new-password"
              [disabled]="submitLoading()"
            / aria-label=\"input\">
          } @else {
            <input
              id="npc"
              type="text"
              class="form-control"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              autocomplete="new-password"
              [disabled]="submitLoading()"
            / aria-label=\"input\">
          }
        </div>

        @if (error()) {
          <div class="alert alert-danger text-start mb-3" role="alert">
            {{ error() }}
          </div>
        }

        <button type="button" class="btn btn-primary shadow-2 mb-3 w-100" [disabled]="submitLoading()" (click)="submit()" tabindex="0" (keydown.enter)="null">
          @if (submitLoading()) {
            <span>Enregistrement…</span>
          } @else {
            <span>Enregistrer et aller à la connexion</span>
          }
        </button>

        <p class="mb-0 text-muted">
          <a [routerLink]="['/login']">Annuler</a>
        </p>
      </div>
    </div>
  </div>
</div>
