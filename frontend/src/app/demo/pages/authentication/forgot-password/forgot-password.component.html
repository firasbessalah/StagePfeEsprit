<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-mail auth-icon"></i>
        </div>
        <h3 class="mb-2">Mot de passe oublié</h3>
        <p class="text-muted mb-4">
          Entrez l’adresse email de votre compte. Nous vous enverrons un code à 6 chiffres pour continuer.
        </p>

        <div class="text-start mb-3">
          <label class="form-label" for="forgot-email">Email</label>
          <input
            id="forgot-email"
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            [disabled]="loading()"
            placeholder="vous@exemple.com"
          / aria-label=\"input\">
        </div>

        @if (error()) {
          <div class="alert alert-danger text-start mb-3" role="alert">
            {{ error() }}
          </div>
        }

        <button type="button" class="btn btn-primary shadow-2 mb-3 w-100" [disabled]="loading()" (click)="submit()" tabindex="0" (keydown.enter)="null">
          @if (loading()) {
            <span>Envoi en cours…</span>
          } @else {
            <span>Envoyer le code</span>
          }
        </button>

        <p class="mb-0 text-muted">
          <a [routerLink]="['/login']">Retour à la connexion</a>
        </p>
      </div>
    </div>
  </div>
</div>
